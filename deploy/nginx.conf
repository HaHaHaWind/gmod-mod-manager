# nginx 反向代理:对外 8080,转发到本机 uvicorn(127.0.0.1:8000)。
# 安装:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/gmod-mod-manager.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 说明:
#   - 全部走同源反代,Cookie 不跨域,CSRF 机制保持简单可靠。
#   - /api/preview 是图片代理,加大缓冲与超时。

server {
    listen 8080;
    server_name _;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 上传/请求体上限(面板主要是 JSON,放宽到 2MB 足够)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 预览图代理:图片较大时给更长超时
    location /api/preview {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 健康检查(供负载均衡/监控使用)
    location = /api/system/status {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
